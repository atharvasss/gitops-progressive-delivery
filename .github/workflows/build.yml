name: Build-Test-Scan-Push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/gitops-demo:${{ github.sha }} .

    - name: Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/gitops-demo:${{ github.sha }}
        format: table
        severity: HIGH,CRITICAL
        exit-code: 0

    - name: Login GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push image
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/gitops-demo:${{ github.sha }}
